name: privates
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter_animate: ^4.5.2
  flutter_svg: ^2.1.0
  flutter:
    sdk: flutter
  stacked: ^3.4.0
  stacked_services: ^1.1.0

dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/manrope/Manrope-Bold.ttf
        - asset: fonts/manrope/Manrope-Medium.ttf
        - asset: fonts/manrope/Manrope-Regular.ttf
        - asset: fonts/manrope/Manrope-SemiBold.ttf
    - family: Nunito
      fonts:
        - asset: fonts/nunito/Nunito-Black.ttf